name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说场景，再说方案。VoiceRelay 的目标是「手机上按住说话，文字落到 Mac 当前输入框」，超出这个范围的建议也欢迎，但请说明为什么值得做。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      placeholder: "在浏览器地址栏里按住说话，经常注入失败……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - Mac 端 UI
        - 手机端 UI
        - 识别（ASR）
        - 注入
        - 协议/传输
        - 屏幕共享
        - 打包/分发
        - 文档
  - type: checkboxes
    id: help
    attributes:
      label: 你是否愿意实现
      options:
        - label: 我可以提交 PR
        - label: 我可以帮忙测试
