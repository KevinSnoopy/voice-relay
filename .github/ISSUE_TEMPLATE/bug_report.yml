name: Bug 报告
description: 报告可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。安全问题请走 [SECURITY.md](../blob/main/SECURITY.md) 的私密渠道，不要在这里贴漏洞细节。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - macOS（Mac 端）
        - Android（手机端）
        - iOS（手机端）
        - 构建/打包
        - 文档/原型
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本或 commit SHA
      placeholder: "v1.0.0 / 3f2a1c9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统与机型
      placeholder: "macOS 13.7.8 · Intel MacBook Pro 2019 / Android 14 · 小米 13"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 手机与 Mac 连同一个 Wi-Fi
        2. 扫码连接
        3. 按住说话 3 秒后松手
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图、录屏或日志更好。日志在 `~/Library/Logs/VoiceRelay/`（macOS）或 `adb logcat`（Android）。
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: 相关功能
      multiple: true
      options:
        - 配对/连接
        - 语音识别
        - 文字注入
        - 屏幕共享
        - BLE
        - 权限
        - 安装/更新
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我已移除日志中的个人信息与配对密钥
          required: true
