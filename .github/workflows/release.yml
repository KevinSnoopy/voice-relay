name: Release

# 手动触发：Actions → Release → Run workflow，填入版本号（如 1.0.0）。
# 这样不会和本地出包 / 已有 Release 的标签冲突；正式签名仍建议本地完成。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），例如 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sherpa-onnx runtime
        run: ./mac/scripts/fetch-deps.sh

      - name: Build DMG
        env:
          VERSION: ${{ inputs.version }}
        run: cd mac && ./scripts/package-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: mac/build/VoiceRelay-*.dmg

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Build APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd mobile/voicerelay
          flutter pub get
          flutter build apk --release
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk "build/dist/VoiceRelay-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/voicerelay/build/dist/*.apk

  publish:
    name: Publish draft release
    needs: [dmg, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -maxdepth 3 -print

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: VoiceRelay ${{ inputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
