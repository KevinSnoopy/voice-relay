name: voicerelay
description: VoiceRelay 手机端：按住说话，字出现在 Mac 上。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  record: ^6.2.1
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  flutter_blue_plus: ^1.32.0
  multicast_dns: ^0.3.3
  mobile_scanner: ^5.2.3
  flutter_webrtc: ^1.6.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
